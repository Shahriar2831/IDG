<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Advance Token Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Code+Pro:wght@400;600&family=Lato:wght@300;400;700&display=swap');

  :root {
    --ink: #1a1a2e;
    --paper: #fdf6e3;
    --accent: #c0392b;
    --gold: #b8860b;
    --light-rule: #d4c5a9;
    --stamp-green: #27ae60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2c3e50;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 10px,
      rgba(255,255,255,0.02) 10px,
      rgba(255,255,255,0.02) 20px
    );
    min-height: 100vh;
    font-family: 'Lato', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
    gap: 30px;
  }

  h1.app-title {
    font-family: 'Playfair Display', serif;
    color: #ecf0f1;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: 2px;
    text-align: center;
  }
  h1.app-title span {
    color: #e74c3c;
  }

  .form-card {
    background: white;
    border-radius: 4px;
    padding: 28px 32px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    border-top: 5px solid var(--accent);
  }

  .form-card h2 {
    font-family: 'Playfair Display', serif;
    color: var(--ink);
    font-size: 1.1rem;
    margin-bottom: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--light-rule);
    padding-bottom: 10px;
  }

  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #666;
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 9px 12px;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    background: white;
  }
  .field textarea { resize: vertical; min-height: 60px; }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  button.generate-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 3px;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s, transform 0.1s;
  }
  button.generate-btn:hover { background: #a93226; transform: translateY(-1px); }
  button.generate-btn:active { transform: translateY(0); }

  /* TOKEN STYLES */
  .token-wrapper {
    width: 100%;
    max-width: 680px;
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .token-wrapper.visible { display: flex; }

  .token-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .token-actions button {
    padding: 9px 22px;
    border: none;
    border-radius: 3px;
    font-family: 'Lato', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .token-actions button:hover { opacity: 0.85; }
  .btn-print { background: #ecf0f1; color: var(--ink); }
  .btn-new { background: var(--stamp-green); color: white; }

  .token-pair {
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--paper);
    border: 1px solid var(--light-rule);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }

  /* EACH HALF */
  .token-half {
    padding: 22px 28px 18px;
    position: relative;
  }

  /* OFFICE COPY */
  .token-half.office {
    border-bottom: none;
  }

  /* PAYEE COPY */
  .token-half.payee {
    border-top: 2px dashed var(--light-rule);
  }

  /* PERFORATION LINE */
  .perf-line {
    display: flex;
    align-items: center;
    padding: 4px 28px;
    background: var(--paper);
    gap: 8px;
  }
  .perf-line span {
    font-size: 0.62rem;
    letter-spacing: 2px;
    color: #aaa;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .perf-line .dash { flex: 1; border-top: 2px dashed #c8b88a; }

  /* HEADER */
  .token-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .token-header .company-block .company-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .token-header .company-block .doc-type {
    font-size: 0.65rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  .token-header .token-id-block {
    text-align: right;
  }
  .token-header .token-id-block .token-num {
    font-family: 'Source Code Pro', monospace;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
  }
  .token-header .token-id-block .token-date {
    font-size: 0.7rem;
    color: #888;
    margin-top: 2px;
  }

  /* COPY BADGE */
  .copy-badge {
    position: absolute;
    top: 16px;
    right: 28px;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
  }
  .office .copy-badge {
    background: var(--ink);
    color: white;
  }
  .payee .copy-badge {
    background: var(--stamp-green);
    color: white;
  }

  /* FIELDS ROW */
  .token-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
    margin-bottom: 12px;
  }
  .token-field label {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #999;
    display: block;
    margin-bottom: 2px;
    font-weight: 700;
  }
  .token-field .val {
    font-size: 0.92rem;
    color: var(--ink);
    font-weight: 700;
    border-bottom: 1px solid var(--light-rule);
    padding-bottom: 3px;
    min-height: 22px;
  }
  .token-field.full { grid-column: 1 / -1; }

  .amount-highlight {
    background: var(--ink);
    color: var(--paper);
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    border-radius: 2px;
  }
  .amount-highlight .label {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .amount-highlight .amt {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 1px;
  }

  /* SIGNATURE LINE */
  .sig-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--light-rule);
  }
  .sig-block label {
    font-size: 0.58rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    display: block;
    margin-bottom: 18px;
  }
  .sig-block .sig-line {
    border-bottom: 1px solid var(--ink);
    height: 1px;
    margin-bottom: 4px;
  }
  .sig-block .sig-name {
    font-size: 0.68rem;
    color: #888;
    letter-spacing: 1px;
  }

  /* WATERMARK */
  .watermark {
    position: absolute;
    bottom: 14px;
    right: 20px;
    font-family: 'Source Code Pro', monospace;
    font-size: 0.58rem;
    color: rgba(0,0,0,0.08);
    letter-spacing: 3px;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* PRINT */
  @media print {
    body { background: white; padding: 10px; }
    .form-card, .token-actions, h1.app-title { display: none !important; }
    .token-wrapper { display: flex !important; max-width: 100%; }
    .token-pair { box-shadow: none; border: 1px solid #aaa; }
    .perf-line .dash { border-top-color: #aaa; }
  }
</style>
</head>
<body>

<h1 class="app-title">Cash Advance <span>Token</span> Generator</h1>

<!-- FORM -->
<div class="form-card">
  <h2>Issue New Token</h2>

  <div class="row">
    <div class="field">
      <label>Company / Department Name</label>
      <input type="text" id="company" placeholder="e.g. Apex Holdings Ltd." value="">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Recipient Name</label>
      <input type="text" id="recipientName" placeholder="Full name">
    </div>
    <div class="field">
      <label>Designation / Dept.</label>
      <input type="text" id="recipientDept" placeholder="e.g. Sales – Lagos">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Amount (₦)</label>
      <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="field">
      <label>Currency</label>
      <select id="currency">
        <option value="₦">₦ Naira</option>
        <option value="$">$ Dollar</option>
        <option value="€">€ Euro</option>
        <option value="£">£ Pound</option>
        <option value="KSh">KSh Shilling</option>
        <option value="GH₵">GH₵ Cedi</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label>Purpose of Advance</label>
    <textarea id="purpose" placeholder="e.g. Field trip logistics for Kano branch visit"></textarea>
  </div>

  <div class="row">
    <div class="field">
      <label>Expected Return / Retirement Date</label>
      <input type="date" id="retireDate">
    </div>
    <div class="field">
      <label>Issued By (Accounts Officer)</label>
      <input type="text" id="issuedBy" placeholder="Your name">
    </div>
  </div>

  <button class="generate-btn" onclick="generateToken()">⬇ Generate Token</button>
</div>

<!-- TOKEN OUTPUT -->
<div class="token-wrapper" id="tokenWrapper">
  <div class="token-actions">
    <button class="btn-print" onclick="window.print()">🖨 Print Token</button>
    <button class="btn-new" onclick="resetForm()">＋ New Token</button>
  </div>

  <div class="token-pair" id="tokenPair">
    <!-- Filled by JS -->
  </div>
</div>

<script>
  function pad(n, w) { return String(n).padStart(w, '0'); }

  function generateTokenID() {
    const now = new Date();
    const yy = String(now.getFullYear()).slice(-2);
    const mm = pad(now.getMonth() + 1, 2);
    const dd = pad(now.getDate(), 2);
    const rnd = pad(Math.floor(Math.random() * 9999), 4);
    return `CAT-${yy}${mm}${dd}-${rnd}`;
  }

  function formatAmount(val, currency) {
    const num = parseFloat(val);
    if (isNaN(num)) return `${currency} --`;
    return `${currency} ${num.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function today() {
    return new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function buildHalf(data, type) {
    const isOffice = type === 'office';
    const badgeLabel = isOffice ? 'Office Copy' : 'Payee Copy';
    const halfClass = isOffice ? 'office' : 'payee';

    return `
    <div class="token-half ${halfClass}">
      <div class="token-header">
        <div class="company-block">
          <div class="company-name">${data.company || 'YOUR COMPANY'}</div>
          <div class="doc-type">Cash Advance Token</div>
        </div>
        <div class="token-id-block">
          <div class="token-num">${data.tokenID}</div>
          <div class="token-date">Issued: ${data.issueDate}</div>
        </div>
      </div>

      <span class="copy-badge">${badgeLabel}</span>

      <div class="amount-highlight">
        <span class="label">Amount</span>
        <span class="amt">${data.amountFormatted}</span>
      </div>

      <div class="token-grid">
        <div class="token-field">
          <label>Recipient</label>
          <div class="val">${data.recipientName || '—'}</div>
        </div>
        <div class="token-field">
          <label>Dept. / Role</label>
          <div class="val">${data.recipientDept || '—'}</div>
        </div>
        <div class="token-field full">
          <label>Purpose of Advance</label>
          <div class="val">${data.purpose || '—'}</div>
        </div>
        <div class="token-field">
          <label>Retirement Date</label>
          <div class="val">${data.retireDate}</div>
        </div>
        <div class="token-field">
          <label>Issued By</label>
          <div class="val">${data.issuedBy || '—'}</div>
        </div>
      </div>

      <div class="sig-row">
        <div class="sig-block">
          <label>Accounts Officer Signature</label>
          <div class="sig-line"></div>
          <div class="sig-name">${data.issuedBy || 'Authorised Signatory'}</div>
        </div>
        <div class="sig-block">
          <label>Recipient Acknowledgment</label>
          <div class="sig-line"></div>
          <div class="sig-name">${data.recipientName || 'Recipient'}</div>
        </div>
      </div>

      <div class="watermark">CONFIDENTIAL · ${data.tokenID}</div>
    </div>`;
  }

  function generateToken() {
    const data = {
      company:        document.getElementById('company').value.trim(),
      recipientName:  document.getElementById('recipientName').value.trim(),
      recipientDept:  document.getElementById('recipientDept').value.trim(),
      amount:         document.getElementById('amount').value,
      currency:       document.getElementById('currency').value,
      purpose:        document.getElementById('purpose').value.trim(),
      retireDate:     formatDate(document.getElementById('retireDate').value),
      issuedBy:       document.getElementById('issuedBy').value.trim(),
      tokenID:        generateTokenID(),
      issueDate:      today(),
    };
    data.amountFormatted = formatAmount(data.amount, data.currency);

    const pair = document.getElementById('tokenPair');
    pair.innerHTML =
      buildHalf(data, 'office') +
      `<div class="perf-line">
        <div class="dash"></div>
        <span>✂ detach here · payee copy below</span>
        <div class="dash"></div>
       </div>` +
      buildHalf(data, 'payee');

    const wrapper = document.getElementById('tokenWrapper');
    wrapper.classList.add('visible');
    wrapper.scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('tokenWrapper').classList.remove('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
  </html>
